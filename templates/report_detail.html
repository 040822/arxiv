<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report.report_date }} 报告 - AI 论文数据库</title>
    <link rel="stylesheet" href="/static/css/core.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages/reports.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div></div>
                <a href="/settings" class="settings-btn" title="设置">⚙️ 设置</a>
            </div>
            <h1>🤖 AI 论文数据库</h1>
        </header>

        <nav class="nav-bar">
            <a href="/" class="nav-link">首页</a>
            <a href="/reports" class="nav-link">📊 报告汇总</a>
            <a href="/reports/{{ report.report_date }}" class="nav-link active">📅 {{ report.report_date }}</a>
        </nav>

        <div class="report-header">
            <div class="report-header-top">
                <h2>📊 {{ report.report_date }} 每日报告</h2>
                <button id="regenerate-report-btn" class="btn btn-primary" onclick="regenerateReport(this)">🔄 重新生成该日报告</button>
            </div>
            <div class="report-meta">
                <span>📄 {{ report.paper_count }} 篇论文</span>
                <span>🔍 {{ report.analyzed_count }} 篇已分析</span>
                <span>⭐ 平均评级 {{ report.avg_rating }}</span>
            </div>
            <div id="regenerate-report-status" class="action-status"></div>
        </div>

        <div class="report-content">
            {{ report.content | safe }}
        </div>

        <footer>
            <p>AI 论文数据库 · 每日自动更新 · Powered by arXiv API + OpenAI</p>
        </footer>
    </div>
    <script>
        const reportDate = {{ report.report_date | tojson }};

        async function regenerateReport(btn) {
            if (!confirm(`重新生成 ${reportDate} 的日报告？当前报告内容会被覆盖。`)) return;
            const statusEl = document.getElementById('regenerate-report-status');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ 生成中...';
            statusEl.className = 'action-status info';
            statusEl.textContent = '正在重新生成报告...';

            try {
                const resp = await fetch(`/api/generate?date=${encodeURIComponent(reportDate)}`, {method: 'POST'});
                const result = await resp.json();
                if (resp.status === 401 || result.auth_required) {
                    window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
                    return;
                }
                statusEl.className = result.status === 'ok' ? 'action-status success' : 'action-status error';
                statusEl.textContent = (result.status === 'ok' ? '✅ ' : '❌ ') + (result.message || '操作完成');
                if (result.status === 'ok') {
                    setTimeout(() => window.location.reload(), 800);
                }
            } catch (e) {
                statusEl.className = 'action-status error';
                statusEl.textContent = '❌ ' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
