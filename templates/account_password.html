<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>修改密码 - AI 论文数据库</title>
    <link rel="stylesheet" href="/static/css/core.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages/auth.css">
    <script src="/static/auth.js"></script>
</head>
<body>
    <div class="container">
        <header><h1>🔑 修改密码</h1></header>
        <div class="settings-section login-card">
            {% if current_user.must_change_password %}
            <h3>首次登录必须修改临时密码</h3>
            <p class="section-desc">完成修改后才能访问其他功能。</p>
            {% else %}<h3>修改账号密码</h3>{% endif %}
            <div class="form-group"><label>当前密码</label><input type="password" id="current-password" autofocus></div>
            <div class="form-group"><label>新密码（至少 12 字符）</label><input type="password" id="new-password"></div>
            <div class="settings-actions">
                <button class="btn btn-primary" onclick="changePassword()">保存新密码</button>
                <button class="btn" onclick="logout()">退出登录</button>
            </div>
            <div id="status" class="action-status"></div>
        </div>
    </div>
    <script>
        async function changePassword() {
            const status = document.getElementById('status');
            const resp = await fetch('/api/account/password', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    current_password: document.getElementById('current-password').value,
                    new_password: document.getElementById('new-password').value
                })
            });
            const result = await resp.json();
            status.textContent = result.message || '';
            status.className = 'action-status ' + (resp.ok ? 'success' : 'error');
            if (resp.ok) window.location.href = '/';
        }
        async function logout() {
            await fetch('/api/auth/logout', {method: 'POST'});
            window.location.href = '/login';
        }
    </script>
</body>
</html>
