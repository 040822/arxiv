<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>修改密码 - AI 论文数据库</title>
    <link rel="stylesheet" href="/static/css/core.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages/auth.css">
    <script src="/static/auth.js"></script>
</head>
<body>
    <div class="container">
        <header><h1>🔑 修改密码</h1></header>
        <div class="settings-section login-card">
            {% if current_user.must_change_password %}
            <h3>首次登录必须修改临时密码</h3>
            <p class="section-desc">完成修改后才能访问其他功能。</p>
            {% else %}<h3>修改账号密码</h3>{% endif %}
            <form id="password-form" onsubmit="changePassword(event)">
              <div class="form-group">
                <label for="current-password">当前密码</label>
                <div class="input-group password-input-group">
                    <input type="password" id="current-password" autocomplete="current-password" autofocus>
                    <button type="button" class="password-toggle" data-password-toggle="current-password" aria-label="显示密码" aria-pressed="false" onclick="AuthUI.togglePassword('current-password', this)">👁</button>
                </div>
              </div>
              <div class="form-group">
                <label for="new-password">新密码（至少 {{ password_min_length }} 个字符）</label>
                <div class="input-group password-input-group">
                    <input type="password" id="new-password" minlength="{{ password_min_length }}" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle="new-password" aria-label="显示密码" aria-pressed="false" onclick="AuthUI.togglePassword('new-password', this)">👁</button>
                </div>
              </div>
              <div class="form-group">
                <label for="confirm-password">确认新密码</label>
                <div class="input-group password-input-group">
                    <input type="password" id="confirm-password" minlength="{{ password_min_length }}" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle="confirm-password" aria-label="显示密码" aria-pressed="false" onclick="AuthUI.togglePassword('confirm-password', this)">👁</button>
                </div>
              </div>
              <div class="settings-actions">
                <button class="btn btn-primary" type="submit">保存新密码</button>
                <button class="btn" type="button" onclick="AuthUI.logout()">退出登录</button>
              </div>
              <div id="status" class="action-status" role="status" aria-live="polite" aria-atomic="true"></div>
            </form>
        </div>
    </div>
    <script>
        async function changePassword(event) {
            event?.preventDefault();
            const status = document.getElementById('status');
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            if (newPassword.length < {{ password_min_length }}) {
                status.className = 'action-status error';
                status.textContent = '❌ 新密码至少需要 {{ password_min_length }} 个字符';
                return;
            }
            if (newPassword !== confirmPassword) {
                status.className = 'action-status error';
                status.textContent = '❌ 两次输入的密码不一致';
                return;
            }
            status.className = 'action-status info';
            status.textContent = '正在保存...';
            try {
                const resp = await fetch('/api/account/password', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({current_password: currentPassword, new_password: newPassword})
                });
                const result = await resp.json();
                status.textContent = result.message || '';
                status.className = 'action-status ' + (resp.ok ? 'success' : 'error');
                if (resp.ok) window.location.href = '/';
            } catch (e) {
                status.className = 'action-status error';
                status.textContent = '❌ ' + e.message;
            }
        }
    </script>
</body>
</html>
